name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  docker-publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        id: check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are not set; skipping Docker Hub publish."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.check.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            smarquezp/docker-acestream-ubuntu-home:${{ github.ref_name }}
            smarquezp/docker-acestream-ubuntu-home:latest

  github-release-asset:
    name: Attach SetupAcestream.bat to the GitHub release
    runs-on: ubuntu-latest
    needs: docker-publish
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload SetupAcestream.bat if a release exists for this tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" SetupAcestream.bat --clobber
          else
            echo "::notice::No GitHub release found for ${GITHUB_REF_NAME}; skipping asset upload."
          fi
