# ================================================
# ACESTREAM ENGINE CONFIGURATION
# Full production configuration
# ================================================

# === BASIC CONFIGURATION ===
--allow-user-config
--bind-all
--client-console

# === MULTIPLE CLIENTS AND CONCURRENCY ===
--max-connections 1000
--max-peers 50
--max-upload-slots 7

# === LOGGING AND DEBUGGING ===
# --log-debug (a legacy bitmask flag from older engine releases) is not
# recognized by 3.2.11's argument parser and had no measurable effect
# (verified: startup log always shows "set debug level: 0" regardless of
# its value) — dropped as dead configuration.
# --log-stdout-level pins the verbosity explicitly instead of relying on
# the engine's undocumented default. Measured end-to-end (startup + a full
# getstream/stat/manifest/segment cycle) at "info": ~70 log lines, so this
# is not the noisy default the flag name implies.
# Log rotation is intentionally NOT configured here (no --log-file /
# --log-max-size / --log-backup-count): stdout logging lets Docker's own
# logging driver (json-file, with its own size/rotation limits) own
# rotation, which is simpler than duplicating that logic inside the engine.
--log-stdout
--log-stdout-level info

# === STABILITY AND PERFORMANCE ===
--cache-limit 5
--use-internal-buffering true

# === NETWORK CONFIGURATION ===
--make-default-access-token true

# === CONNECTION OPTIMIZATION ===
--cache-auto true
