services:
  acestream:
    image: smarquezp/docker-acestream-ubuntu-home:latest
    container_name: acestream
    ports:
      - 6878:6878
    environment:
      - INTERNAL_IP=127.0.0.1
      - HTTP_PORT=6878
      - HTTPS_PORT=6879
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6878/webui/api/service?method=get_version', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  acestream-ram:
    extends:
      service: acestream
    container_name: acestream-ram
    profiles: ["ram"]
    ports:
      - 6878:6878
    tmpfs:
      - /root/.ACEStream/.acestream_cache:rw,noexec,nosuid,size=8g

  acestream-memory:
    extends:
      service: acestream
    container_name: acestream-memory
    profiles: ["memory"]
    ports:
      - 6878:6878
    environment:
      - INTERNAL_IP=127.0.0.1
      - HTTP_PORT=6878
      - HTTPS_PORT=6879
      - ACESTREAM_EXTRA_FLAGS=--live-cache-type memory

networks:
  default:
    driver: bridge
