services:
  acestream-engine:
    image: ${ACESTREAM_IMAGE:-smarquezp/docker-acestream-ubuntu-home:latest}
    container_name: acestream-engine
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-6878}:${HTTP_PORT:-6878}
    environment:
      - HTTP_PORT=${HTTP_PORT:-6878}
      - HTTPS_PORT=${HTTPS_PORT:-6879}
      - ACESTREAM_EXTRA_FLAGS=${ACESTREAM_EXTRA_FLAGS:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Healthcheck defined in Dockerfile (single source of truth)

  acestream-ram:
    extends:
      service: acestream-engine
    container_name: acestream-engine-ram
    profiles: ["ram"]
    tmpfs:
      - /root/.ACEStream/.acestream_cache:rw,noexec,nosuid,size=8g

  # Memory cache mode: Acestream's native in-memory live cache.
  # 'extends' merges environment by key, so only the override is needed.
  acestream-memory:
    extends:
      service: acestream-engine
    container_name: acestream-engine-memory
    profiles: ["memory"]
    environment:
      - ACESTREAM_EXTRA_FLAGS=--live-cache-type memory
