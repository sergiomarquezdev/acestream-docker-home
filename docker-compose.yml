services:
  acestream-engine:
    image: smarquezp/docker-acestream-ubuntu-home:latest
    container_name: acestream-engine
    ports:
      - 6878:6878
    environment:
      - INTERNAL_IP=127.0.0.1
      - HTTP_PORT=6878
      - HTTPS_PORT=6879
    # Healthcheck defined in Dockerfile (single source of truth)

  acestream-ram:
    extends:
      service: acestream-engine
    container_name: acestream-engine-ram
    profiles: ["ram"]
    ports:
      - 6878:6878
    tmpfs:
      - /root/.ACEStream/.acestream_cache:rw,noexec,nosuid,size=8g

  # Memory cache mode: Uses Acestream's native memory cache
  # Note: environment vars are duplicated here because Docker Compose
  # replaces (not merges) the parent's environment when using 'extends'.
  # This is intentional to add ACESTREAM_EXTRA_FLAGS while preserving
  # backward compatibility (no 'default' profile on base service).
  acestream-memory:
    extends:
      service: acestream-engine
    container_name: acestream-engine-memory
    profiles: ["memory"]
    ports:
      - 6878:6878
    environment:
      - INTERNAL_IP=127.0.0.1
      - HTTP_PORT=6878
      - HTTPS_PORT=6879
      - ACESTREAM_EXTRA_FLAGS=--live-cache-type memory

networks:
  default:
    driver: bridge
