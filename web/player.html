<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
        Locked down for an offline/LAN deployment: everything the page needs
        (video.js, its Spanish language pack, styles and app code) is vendored
        under /webui/, so default-src 'self' is enough. media-src/worker-src
        need blob: because the bundled HLS tech (VHS) demuxes segments into a
        MediaSource via blob: URLs and a Worker created from a Blob.
    -->
    <!-- CSP: scripts only from this origin. style-src allows inline styles because
         video.js sets them at runtime (dimensions, control state). -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <title>Ace Link Player</title>
    <!-- Inline SVG favicon: self-contained, no external request -->
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230077b6'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='%23fff'/%3E%3C/svg%3E" />
    <!-- Vendored locally (video.js 8.24.1, verified against the npm registry
         shasum/integrity) so the player also works on an offline LAN. -->
    <link href="/webui/vendor/videojs/video-js.css" rel="stylesheet"
        integrity="sha384-dpbcCWfATZaCWE7JVFqi6oCsj7ub0Jrb6MSSYcJLafFDdYY0Sz1gLhY+dayi0ZEm" />
    <link href="/webui/html/player.css" rel="stylesheet" />
</head>

<body>
    <div id="player-container">
        <button id="toggle-panel-btn" type="button" aria-label="Hide panel" aria-expanded="true">
            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
                <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7" />
            </svg>
            <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor"
                viewBox="0 0 16 16" aria-hidden="true">
                <path
                    d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7.029 7.029 0 0 0 2.79-.588M5.21 3.088A7.028 7.028 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474L5.21 3.089z" />
                <path
                    d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829l-2.83-2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z" />
            </svg>
        </button>

        <video id="video" class="video-js vjs-default-skin" controls preload="auto">
            <p class="vjs-no-js">
                To view this video please enable JavaScript, and consider upgrading to a web browser that
                <a href="https://videojs.com/html5-video-support/" target="_blank" rel="noopener noreferrer">supports
                    HTML5 video</a>
            </p>
        </video>

        <div id="loading-overlay" aria-live="polite">
            <div class="spinner" aria-hidden="true"></div>
            <div class="loading-text" id="loading-text">Connecting to the stream...</div>
        </div>

        <div id="press-play-hint" aria-live="polite">
            <div class="hint-bubble" id="press-play-text"></div>
        </div>

        <div id="input-panel">
            <div id="input-box">
                <div id="welcome">
                    <h1 id="title-text">Ace Stream Player</h1>
                    <p id="subtitle-text">Paste an Ace Stream link or content ID below and press Play.</p>
                </div>
                <div id="error-message" role="alert"></div>
                <form id="input-form">
                    <label for="acestream-link-input" class="sr-only" id="input-label">Ace Stream link or content
                        ID</label>
                    <input type="text" id="acestream-link-input" autocomplete="off" autocapitalize="none"
                        spellcheck="false" placeholder="acestream://... or 40-character ID" />
                    <button id="play-button" type="submit">Play</button>
                </form>
                <p id="help-text">
                    <span id="help-label">Where do I get a link?</span>
                    <span id="help-body">A link looks like <code>acestream://&lt;40 characters&gt;</code> and comes from
                        the channel list or community where you found the stream.</span>
                </p>
                <div id="lang-controls">
                    <button class="lang-button active" type="button" data-lang="en" aria-label="English"
                        aria-pressed="true">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30" aria-hidden="true">
                            <clipPath id="t-uk">
                                <path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z" />
                            </clipPath>
                            <path d="M0,0 v30 h60 v-30 z" fill="#00247d" />
                            <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6" />
                            <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#t-uk)" stroke="#cf142b"
                                stroke-width="4" />
                            <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10" />
                            <path d="M30,0 v30 M0,15 h60" stroke="#cf142b" stroke-width="6" />
                        </svg>
                    </button>
                    <button class="lang-button" type="button" data-lang="es" aria-label="Español"
                        aria-pressed="false">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" aria-hidden="true">
                            <rect width="750" height="500" fill="#c60b1e" />
                            <rect width="750" height="250" y="125" fill="#ffc400" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="attribution">
            <a id="attribution-link" href="https://github.com/sergiomarquezdev/acestream-docker-home" target="_blank"
                rel="noopener noreferrer">
                <!-- Inline GitHub mark: no external image request -->
                <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" focusable="false">
                    <path fill="currentColor"
                        d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.02 1.93-.02 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                </svg>
            </a>
        </div>
    </div>

    <script src="/webui/vendor/videojs/video.min.js"
        integrity="sha384-9LtdENn4aCK5YUSBEw9zQT/tT1eCah4K4BlWimkvqqCaURKD4rBN00ZHMe26ny2O"></script>
    <script src="/webui/vendor/videojs/lang/es.js"
        integrity="sha384-ViN9R5ud+/LHMucsPJ9unPOj2wfc2yh9wJsuHQYptkx9iiM4hmLo1CZVJSbPcEvj"></script>
    <script src="/webui/html/player.js"></script>
</body>

</html>
